# Refreshes the visual baselines (CDS-43, plan step 6): runs the visual checks in update mode on Linux, the only place the baselines are valid
# (decision D2), and pushes the 34 images to a new branch for a pull request. It never commits to main. The images are also kept as an
# artefact so they can be looked at before anyone accepts them (decision D5).
#
# The runner is ubuntu-24.04, the same as visual.yml, so the baselines are made where they are compared.
#
# Manual only. The repository does not allow Actions to open pull requests, so the workflow pushes the branch and prints its name; the pull
# request is opened from there.
#
# Two jobs, so that no code of the project runs with a token that can write (CDS-48 B-11): `make` installs the project's dependencies and runs its
# tests with a read-only token and no stored credentials, and hands the images over as an artifact; `push` has the write token and runs only git
# and shell on the images. The files `make` produces are images, and `push` refuses anything in the folder that is not a PNG.
name: Visual baselines

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-baselines
  cancel-in-progress: false

jobs:
  make:
    name: Make the baselines on Linux
    runs-on: ubuntu-24.04
    # 30, not 20 (CDS-48): as for visual.yml, the browser install can take 10 to 14 minutes on a slow apt mirror.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/api-client/package-lock.json
            demo-apps/demoapp001-react-ui/package-lock.json
            test-harnesses/harness-serenity/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: demo-apps/demoapp001-dotnet-api/global.json
          cache: true
          cache-dependency-path: demo-apps/demoapp001-dotnet-api/*/packages.lock.json

      - name: Install the client, the UI and the harness
        env:
          SCARF_ANALYTICS: "false"
        run: |
          npm ci --prefix packages/api-client --no-audit --no-fund
          npm ci --prefix demo-apps/demoapp001-react-ui --no-audit --no-fund
          npm ci --prefix test-harnesses/harness-serenity --no-audit --no-fund

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: test-harnesses/harness-serenity

      # The old images go first, so a page that was dropped does not leave its image behind.
      - name: Make the baselines
        run: |
          rm -rf visual-baselines
          npm run test:visual -- --update
        working-directory: test-harnesses/harness-serenity

      - name: The baselines, to look at
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: visual-baselines
          path: test-harnesses/harness-serenity/visual-baselines/
          retention-days: 14
          if-no-files-found: error

  push:
    name: Push the images to a branch
    needs: make
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only job with a token that writes. It installs nothing and runs nothing from the project.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: true

      - name: Fetch the images
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: visual-baselines
          path: ${{ runner.temp }}/images

      - name: Push the images to a branch
        env:
          BRANCH: claude/visual-baselines-${{ github.run_id }}
          IMAGES: ${{ runner.temp }}/images
        run: |
          # Only images may come through: the artifact is made by a job that ran the project's code.
          # By name and by content: a file the project's code wrote under a .png name is not an image because of it (CDS-48 C-13).
          if find "$IMAGES" -type f ! -name '*.png' | grep -q .; then
            echo "::error::the artifact holds a file that is not a PNG"
            exit 1
          fi
          for image in "$IMAGES"/*.png; do
            if [ "$(head -c 8 "$image" | od -An -tx1 | tr -d ' \n')" != "89504e470d0a1a0a" ]; then
              echo "::error::$image has a .png name but not the PNG signature"
              exit 1
            fi
          done
          rm -rf test-harnesses/harness-serenity/visual-baselines
          mkdir -p test-harnesses/harness-serenity/visual-baselines
          cp "$IMAGES"/*.png test-harnesses/harness-serenity/visual-baselines/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$BRANCH"
          git add test-harnesses/harness-serenity/visual-baselines
          git commit -m "test: visual baselines made on Linux CI (run ${{ github.run_id }})"
          git push origin "$BRANCH"
          echo "Pushed $BRANCH; open a pull request from it." >> "$GITHUB_STEP_SUMMARY"
