name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specification:
    # Every check that keeps the repository green, through the one command (README 'Checks', CDS-15).
    name: Verify (contract lint, fixtures, Gherkin, mock smoke, client check, client smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
            packages/api-client/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python prerequisite for the Gherkin check
        run: pip install gherkin-official==29.0.0

      - name: Verify
        run: |
          npm ci
          npm run verify
