name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specification:
    # Every check that keeps the repository green, through the one command (README 'Checks', CDS-15).
    name: Verify (contract lint, fixtures, Gherkin, mock smoke, client, service, Schemathesis, Kanban)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
            packages/api-client/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: demo-apps/demoapp001-dotnet-api/global.json
          cache: true
          cache-dependency-path: demo-apps/demoapp001-dotnet-api/*/packages.lock.json

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Python prerequisites (Gherkin check, Schemathesis run)
        run: pip install -r tools/requirements.txt

      # @scarf/scarf (a Prism dependency) reports install analytics to scarf.sh unless this is set (DR-059).
      - name: Verify
        env:
          SCARF_ANALYTICS: "false"
        run: |
          npm ci
          npm run verify

      # The Serenity JSON of the @api run that `verify` made, for the report job (CDS-44). Kept even when a later step failed.
      - name: The Serenity JSON of the @api run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: serenity-json-api
          path: test-harnesses/harness-serenity/reports/serenity/api/
          retention-days: 14
          if-no-files-found: warn

  # The UI (Phase 4, decision brief 11 D4): typecheck, component tests, build, then the @ui scenarios in a real browser
  # against the service, which serves the built UI. A separate job so `verify` stays short and the browser setup is isolated.
  ui:
    name: UI (typecheck, component tests, build, @ui scenarios)
    runs-on: ubuntu-latest
    # 25, not 15 (CDS-48): the work takes about 5 minutes, but 'Install the browser' has taken over 10 on a slow runner, and the limit cancelled the run twice.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/api-client/package-lock.json
            demo-apps/demoapp001-react-ui/package-lock.json
            test-harnesses/harness-serenity/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: demo-apps/demoapp001-dotnet-api/global.json
          cache: true
          cache-dependency-path: demo-apps/demoapp001-dotnet-api/*/packages.lock.json

      # The UI imports the generated client's source, which needs openapi-fetch from the client package.
      - name: Install the client, the UI and the harness
        env:
          SCARF_ANALYTICS: "false"
        run: |
          npm ci --prefix packages/api-client --no-audit --no-fund
          npm ci --prefix demo-apps/demoapp001-react-ui --no-audit --no-fund
          npm ci --prefix test-harnesses/harness-serenity --no-audit --no-fund

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: test-harnesses/harness-serenity

      - name: UI typecheck, component tests and build
        run: npm run check
        working-directory: demo-apps/demoapp001-react-ui

      - name: '@ui scenarios against the service'
        run: npm run test:ui
        working-directory: test-harnesses/harness-serenity

      - name: 'Exit checks: axe-core on every page, the three layouts'
        run: npm run test:exit
        working-directory: test-harnesses/harness-serenity

      # The semantic rules on hand-made pages, in a real browser (CDS-48 A-05, A-06): a bar drawn the wrong width, a chart cell with no figure, a good name.
      - name: 'Semantic rules on hand-made pages'
        run: npm run test:rules
        working-directory: test-harnesses/harness-serenity

      # The Serenity JSON of the @ui run, for the report job (CDS-44). Kept even when a later step failed.
      - name: The Serenity JSON of the @ui run
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: serenity-json-ui
          path: test-harnesses/harness-serenity/reports/serenity/ui/
          retention-days: 14
          if-no-files-found: warn

  # The bug-flag proof (CDS-41, decision D4 of the P3 plan): each implemented flag on and off against its catchers. Its own job because it
  # grows with every flag (about 4 minutes for 19 flags at P3c) and the `ui` job has a 15 minute limit; the two run side by side.
  flags:
    name: Bug-flag proof (each implemented flag on and off against its catchers)
    # Pinned, not ubuntu-latest: with CI=true the proof also runs the two visual catchers against the Linux baselines, which are images made on
    # ubuntu-24.04 (visual.yml). When `latest` moves, their flag-off runs would fail on font rendering and the proof would go red with no defect
    # (CDS-48 A-08, B-09). Move the pin only together with a refresh of the baselines.
    runs-on: ubuntu-24.04
    # 40, not 30 (CDS-48): the proof takes about 16 minutes, but 'Install the browser' took 14 on a slow runner and the limit cancelled the run.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            packages/api-client/package-lock.json
            demo-apps/demoapp001-react-ui/package-lock.json
            test-harnesses/harness-serenity/package-lock.json

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: demo-apps/demoapp001-dotnet-api/global.json
          cache: true
          cache-dependency-path: demo-apps/demoapp001-dotnet-api/*/packages.lock.json

      - name: Install the client, the UI and the harness
        env:
          SCARF_ANALYTICS: "false"
        run: |
          npm ci --prefix packages/api-client --no-audit --no-fund
          npm ci --prefix demo-apps/demoapp001-react-ui --no-audit --no-fund
          npm ci --prefix test-harnesses/harness-serenity --no-audit --no-fund

      - name: Install the browser
        run: npx playwright install --with-deps chromium
        working-directory: test-harnesses/harness-serenity

      - name: 'Bug-flag proof: each implemented flag on and off against its catchers'
        run: npm run test:flags
        working-directory: test-harnesses/harness-serenity

      # The table the proof wrote, kept where a gate can cite it (CDS-45, P7a): in this run's summary, and as an artifact. The artifact is kept for the
      # repository's whole retention (90 days, the same as the log; CDS-48 B-01) and holds each catcher's failure line. The table is written after every
      # flag, so a proof that stops early, or is cancelled at the job's time limit, leaves the flags judged so far.
      - name: The proof table in the job summary
        if: always()
        run: |
          if [ -f reports/bug-flags.md ]; then cat reports/bug-flags.md >> "$GITHUB_STEP_SUMMARY"; else echo 'The proof wrote no table.' >> "$GITHUB_STEP_SUMMARY"; fi
        working-directory: test-harnesses/harness-serenity

      - name: The proof table as an artifact
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bug-flag-proof
          path: |
            test-harnesses/harness-serenity/reports/bug-flags.json
            test-harnesses/harness-serenity/reports/bug-flags.md
          retention-days: 90
          if-no-files-found: warn

      # What the service said, when the proof failed (CDS-46): the proof crashed twice on 2026-10-19 with a dropped connection and no log to read.
      - name: The service logs of a failed or cancelled proof
        if: failure() || cancelled()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: flag-proof-service-logs
          path: /tmp/harness-service-*.log
          retention-days: 14
          if-no-files-found: ignore

  # The Serenity report (CDS-44, P6b): built from the JSON of the two runs that gate this pull request, not from a third run of the suites.
  # Java 21 is for the Serenity BDD CLI, which makes the HTML; `check:report` requires the HTML here (CI=true) and checks every execution,
  # the counts, and that no file holds the run's control key or a token. Nothing is published by this job: the `site` and `deploy` jobs below publish it (CDS-44 P6c).
  report:
    name: Report (the Serenity BDD report of the @api and @ui runs, checked)
    needs: [specification, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: test-harnesses/harness-serenity/package-lock.json

      - name: Set up Java (Serenity BDD report generator)
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 21

      - name: Install the harness
        env:
          SCARF_ANALYTICS: "false"
        run: npm ci --prefix test-harnesses/harness-serenity --no-audit --no-fund

      - name: The Serenity JSON of the @api run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: serenity-json-api
          path: test-harnesses/harness-serenity/reports/serenity/api/

      - name: The Serenity JSON of the @ui run
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: serenity-json-ui
          path: test-harnesses/harness-serenity/reports/serenity/ui/

      - name: Make the report
        run: npm run report
        working-directory: test-harnesses/harness-serenity

      - name: Check the report
        run: npm run check:report
        working-directory: test-harnesses/harness-serenity

      - name: The Serenity report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: serenity-report
          path: test-harnesses/harness-serenity/reports/serenity-report/
          retention-days: 14
          if-no-files-found: warn

  # The site (CDS-44, P6c; DR-060 as amended by DR-066): the Kanban board at the top and the Serenity report under /report/, assembled and
  # checked on every run, so a pull request proves the folder that `deploy` would publish. Only `deploy` publishes, and only from main.
  site:
    name: Site (the board and the Serenity report, assembled and checked)
    needs: [report]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: test-harnesses/harness-serenity/package-lock.json

      - name: Install the harness
        env:
          SCARF_ANALYTICS: "false"
        run: npm ci --prefix test-harnesses/harness-serenity --no-audit --no-fund

      - name: The Serenity report
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: serenity-report
          path: _site/report

      - name: Assemble the site
        env:
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          cp credit-dashboard-sut_implementation-kanban_v1.html _site/index.html
          printf 'commit: %s\nrun: %s\nbuilt: %s\n' "$SOURCE_SHA" "$SOURCE_RUN" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > _site/report/commit.txt

      # The board must carry its tickets, the report must be a report stamped with this commit, nothing else may be in the folder, and no file may
      # hold the run's control key or a token (src/report/site.ts).
      - name: Check the site
        run: npm --prefix test-harnesses/harness-serenity run check:site -- "$GITHUB_WORKSPACE/_site" "${{ github.sha }}"

      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  # Published from main only (a push, or a manual run of this workflow on main). One deployer for the whole site: the board and the report are
  # one deployment, so a second workflow deploying would replace one with the other. pages.yml is manual-only (DR-066).
  deploy:
    name: Deploy (GitHub Pages, main only)
    needs: [site]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
