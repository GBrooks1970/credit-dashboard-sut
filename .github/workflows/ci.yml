name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  specification:
    # Every check that keeps the repository green, through the one command (README 'Checks', CDS-15).
    name: Verify (contract lint, fixtures, Gherkin, mock smoke, client, service, Schemathesis, Kanban)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/package-lock.json
            packages/api-client/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: demo-apps/demoapp001-dotnet-api/global.json
          cache: true
          cache-dependency-path: demo-apps/demoapp001-dotnet-api/*/packages.lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python prerequisites (Gherkin check, Schemathesis run)
        run: pip install -r tools/requirements.txt

      - name: Verify
        run: |
          npm ci
          npm run verify
